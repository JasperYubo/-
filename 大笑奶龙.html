<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>大笑奶龙 Laughing Dragon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;overflow:hidden;touch-action:none;user-select:none;font-family:'Segoe UI',sans-serif;color:#e0d0c0}
canvas{display:block;position:fixed;top:0;left:0}
.screen{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.show{display:flex}
.scr-bg{background:linear-gradient(160deg,#0f0f1a,#1a1530)}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;padding:6px 12px;display:none;justify-content:space-between;align-items:center;background:rgba(0,0,0,.4)}
#hud.show{display:flex}
.hud-l{font-size:13px;color:#ffd700;font-weight:700}
.hud-r{display:flex;gap:12px;align-items:center}
.coin-disp{color:#ffd700;font-size:14px;font-weight:700}
.btn-sm{padding:4px 10px;border-radius:8px;border:1px solid #555;background:rgba(255,255,255,.06);color:#ccc;font-size:12px;cursor:pointer}
.btn-sm:active{transform:scale(.93)}
#fire-btn{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:3px solid #ffd700;background:radial-gradient(circle at 40% 35%,#ffe44d,#ffaa00);font-size:26px;cursor:pointer;z-index:10;display:none;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(255,170,0,.3)}
#fire-btn:active{transform:translateX(-50%) scale(.88)}
#fire-btn.show{display:flex}
.menu-title{font-size:36px;font-weight:900;color:#ffd700;letter-spacing:6px;margin-top:60px}
.menu-sub{color:#777;font-size:12px;margin:8px 0 30px;letter-spacing:2px}
.menu-btn{padding:14px 36px;border:2px solid #ffd700;background:rgba(255,215,0,.08);color:#ffd700;font-size:17px;font-weight:700;border-radius:14px;cursor:pointer;min-width:200px;margin:5px;letter-spacing:3px}
.menu-btn:active{background:rgba(255,215,0,.2)}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px 16px;max-width:360px;width:100%}
.skin-card{border-radius:12px;border:2px solid #333;background:rgba(255,255,255,.04);padding:10px;text-align:center;cursor:pointer;transition:all .2s}
.skin-card:active{transform:scale(.95)}
.skin-card.owned{border-color:#2ecc71}
.skin-card.selected{border-color:#ffd700;box-shadow:0 0 12px rgba(255,215,0,.3)}
.skin-card.locked{opacity:.5}
.skin-img{width:50px;height:50px;border-radius:50%;object-fit:cover;margin:0 auto 6px;display:block}
.skin-name{font-size:11px;font-weight:700;margin-bottom:2px}
.skin-price{font-size:10px;color:#ffd700}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 16px;max-width:360px;width:100%}
.lv-btn{aspect-ratio:1;border-radius:10px;border:2px solid #333;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;color:#888}
.lv-btn.unlocked{border-color:#c9a84c;color:#ffd700;background:rgba(201,168,76,.08)}
.lv-btn.cleared{border-color:#2ecc71;color:#2ecc71;background:rgba(46,204,113,.08)}
.lv-btn.current{border-color:#ffd700;box-shadow:0 0 8px rgba(255,215,0,.3)}
.lv-btn:active{transform:scale(.93)}
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.85)}
.overlay.show{display:flex}
.ov-card{background:linear-gradient(160deg,#1c1525,#2a2035);padding:30px 24px;border-radius:18px;text-align:center;max-width:300px;border:2px solid #ffd700}
.ov-title{font-size:30px;margin-bottom:8px}
.ov-msg{color:#ccc;font-size:13px;margin-bottom:6px}
.ov-coins{color:#ffd700;font-size:16px;font-weight:700;margin-bottom:16px}
.ov-btn{padding:10px 28px;border:2px solid #ffd700;background:rgba(255,215,0,.1);color:#ffd700;font-size:15px;font-weight:700;border-radius:12px;cursor:pointer;margin:4px}
.ov-btn:active{background:rgba(255,215,0,.2)}
.back-bar{width:100%;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.back-btn{color:#999;font-size:14px;cursor:pointer;padding:6px 12px}
.sect-title{color:#ffd700;font-size:18px;font-weight:700;margin:10px 0;letter-spacing:2px}
#laser-btn{position:fixed;bottom:20px;right:18px;width:60px;height:60px;border-radius:50%;border:3px solid #ff3b3b;background:radial-gradient(circle at 40% 35%,#7fd4ff,#ff3b3b);font-size:24px;cursor:pointer;z-index:10;display:none;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(120,180,255,.5)}
#laser-btn:active{transform:scale(.88)}
#laser-btn.show{display:flex}
#laser-btn .lc{position:absolute;top:-4px;right:-4px;background:#ff3b3b;color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}
.star-disp{color:#ffd700;font-size:14px;font-weight:700}
</style>
</head>
<body>
<div id="hud"><div><span class="hud-l" id="hud-level"></span><div id="hud-hint" style="font-size:10px;color:#999;margin-top:2px"></div></div><div class="hud-r"><span class="star-disp" id="hud-stars">⭐⭐⭐</span><span class="coin-disp" id="hud-coins">🪙 0</span><span class="btn-sm" onclick="skipLevel()">跳过-20🪙</span><span class="btn-sm" onclick="showLevels()">关卡</span><span class="btn-sm" onclick="showMenu()">菜单</span></div></div>
<button id="fire-btn" onclick="fire()">😂</button>
<button id="laser-btn" onclick="activateLaser()">⚡<span class="lc" id="laser-count">0</span></button>
<canvas id="c"></canvas>
<div class="overlay" id="win-ov"><div class="ov-card"><div class="ov-title" id="wt">🎉</div><div class="ov-msg" id="wm"></div><div class="ov-coins" id="wc"></div><div><button class="ov-btn" id="wb" onclick="nextLevel()">下一关</button><button class="ov-btn" onclick="showLevels()" style="background:none">选关</button></div></div></div>

<div class="screen scr-bg" id="scr-menu" style="justify-content:center">
<div style="font-size:60px;margin-bottom:10px" id="menu-dragon"></div>
<div class="menu-title">大笑奶龙</div>
<div class="menu-sub">旋转奶龙 · 传递笑声 · 送达手机</div>
<button class="menu-btn" onclick="showLevels()">🎮 开始游戏</button>
<button class="menu-btn" onclick="showShop()" style="border-color:#2ecc71;color:#2ecc71">🛒 皮肤商店</button>
<div style="color:#444;font-size:10px;margin-top:40px">v2.0</div>
</div>

<div class="screen scr-bg" id="scr-levels">
<div class="back-bar"><span class="back-btn" onclick="showMenu()">← 菜单</span><span class="coin-disp" id="lv-coins">🪙 0</span></div>
<div class="sect-title">📖 新手教程</div>
<div class="level-grid" id="tut-grid"></div>
<div class="sect-title" style="margin-top:20px">🎮 随机挑战</div>
<div style="padding:0 16px;text-align:center;max-width:360px;width:100%">
<p style="color:#888;font-size:12px;margin-bottom:12px">从100个关卡中随机抽取，每次都是新挑战！</p>
<button class="menu-btn" onclick="startRandomChallenge()" style="width:100%">🎲 开始挑战</button>
<div style="margin-top:12px;color:#666;font-size:11px" id="challenge-stats"></div>
</div>
<div style="height:40px"></div>
</div>

<div class="screen scr-bg" id="scr-shop">
<div class="back-bar"><span class="back-btn" onclick="showLevels()">← 返回</span><span><span class="star-disp" id="shop-stars">⭐ 0</span> <span class="coin-disp" id="shop-coins">🪙 0</span></span></div>
<div class="sect-title">⭐ 星星商店</div>
<div class="shop-grid" id="star-grid"></div>

// ─── CANVAS ───
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();window.addEventListener('resize',()=>{resize();if(gameState==='play'&&currentLevelId)loadLevel()});

// ─── SAVE/LOAD ───
function save(){try{localStorage.setItem('dragon_save',JSON.stringify({coins,cleared,skin,owned,starBest,starBank,laserCharges}))}catch(e){console.warn('save failed:',e)}}
function load(){try{const d=JSON.parse(localStorage.getItem('dragon_save'));if(!d)return;coins=Number.isFinite(d.coins)?Math.max(0,Math.min(999999,Math.floor(d.coins))):0;cleared=Array.isArray(d.cleared)?d.cleared.filter(x=>/^[tl]\d+$/.test(x)).slice(0,TOTAL_TUT+TOTAL_LV):[];const validIds=new Set(SHOP.map(s=>s.id));owned=Array.isArray(d.owned)?[...new Set(['yellow',...d.owned.filter(x=>validIds.has(x))])]:['yellow'];skin=validIds.has(d.skin)&&owned.includes(d.skin)?d.skin:'yellow';
  starBest=(d.starBest&&typeof d.starBest==='object')?d.starBest:{};
  starBank=Number.isFinite(d.starBank)?Math.max(0,Math.floor(d.starBank)):0;
  laserCharges=Number.isFinite(d.laserCharges)?Math.max(0,Math.floor(d.laserCharges)):0}catch(e){console.warn('load failed:',e);coins=0;cleared=[];skin='yellow';owned=['yellow'];starBest={};starBank=0;laserCharges=0}}

    this.o=[{x:W*0.78,y:H*0.33,w:60,h:60,active:true,img:'ultra'}];
    this.b=[{x:W*0.45,y:H*0.62,r:22,oi:0,cut:false}];}},
]}

function genLevel(n){
  // Seed-based pseudo-random for consistent levels
  let seed=n*7919+1234;
  function rng(){seed=(seed*16807+0)%2147483647;return(seed&0x7fffffff)/2147483647}
  function ri(a,b){return Math.floor(rng()*(b-a+1))+a}
  function rf(a,b){return a+rng()*(b-a)}

  const numDragons=Math.min(2+Math.floor(n/15),4);
  const numObs=n>20?Math.min(Math.floor((n-20)/18),3):0;
  // Level types rotate to use different mechanics
  const lvType=n%4; // 0=reflect, 1=relay+reflect, 2=obstacle+relay, 3=mixed

  return{
    name:"第"+(n+1)+"关",
    hint:["反射关","中转+反射","障碍+中转","综合挑战"][lvType],
    init(){
      seed=n*7919+1234; // 重置种子，保证同一关每次布局一致
      const drags=[];
      this.w=[];this.o=[];this.b=[];

      if(lvType===0){
        // REFLECTION LEVELS: sound must bounce off walls to reach target
        // Source at bottom, target NOT in line of sight, wall angled for reflection
        const srcX=rf(W*0.15,W*0.35);
        drags.push(mkD(srcX,H-160,0,true,true)); // shoots right
        this.t={x:rf(W*0.5,W*0.8)-25,y:ri(45,80),w:50,h:55};
        // Angled wall to bounce sound upward
        const wallX=W*0.75+rf(-20,20);
        const wallTopY=H*0.2+rf(0,H*0.15);
        const wallBotY=H*0.65+rf(0,H*0.1);
        this.w.push({x1:wallX,y1:wallBotY,x2:wallX-rf(40,100),y2:wallTopY,thick:6});
        // Blocking wall to prevent direct upward shot
        this.w.push({x1:0,y1:H*0.45,x2:W*0.5,y2:H*0.45,thick:6});
        // Extra relay dragon for harder levels
        if(n>10)drags.push(mkD(rf(W*0.4,W*0.7),H*0.55,ri(-180,180),true,false));
      }
      else if(lvType===1){
        // RELAY + REFLECTION: relay to dragon, dragon bounces off wall to target
        const srcX=rf(W*0.15,W*0.4);
        drags.push(mkD(srcX,H-160,-45,true,true));
        // Relay dragon on right side
        drags.push(mkD(W*0.75+rf(-30,30),H*0.55+rf(-30,30),180,true,false));
        this.t={x:rf(W*0.1,W*0.35)-25,y:ri(45,80),w:50,h:55};
        // Wall between relay and target for reflection
        const wallY=H*0.3;
        this.w.push({x1:W*0.35,y1:wallY,x2:W*0.8,y2:wallY,thick:6});
        // Angled wall on left for bouncing to target
        this.w.push({x1:W*0.05,y1:H*0.15,x2:W*0.05,y2:H*0.45,thick:6});
        if(n>30)drags.push(mkD(rf(W*0.3,W*0.6),H*0.35,ri(-180,180),true,false));
      }
      else if(lvType===2){
        // OBSTACLE + RELAY: obstacles block direct path, must relay around
        const srcSide=rng()>0.5;
        const srcX=srcSide?rf(W*0.15,W*0.35):rf(W*0.65,W*0.85);
        drags.push(mkD(srcX,H-160,-90,true,true));
        // Relay dragons zigzag
        for(let i=1;i<=numDragons;i++){
          const gy=H-160-i*(H-250)/(numDragons+1);
          const side=(i%2===0)===srcSide;
          drags.push(mkD(side?rf(W*0.15,W*0.35):rf(W*0.65,W*0.85),gy,ri(-180,180),true,false));
        }
        this.t={x:rf(W*0.3,W*0.7)-25,y:ri(45,80),w:50,h:55};
        // Obstacles block center path
        const obsCount=Math.max(1,numObs);
        for(let i=0;i<obsCount;i++){
          const oy=H*0.25+i*(H*0.35)/Math.max(obsCount,1);
          this.o.push({x:W*0.4-30,y:oy,w:60,h:60,active:true,img:rng()>0.5?'bear':'ultra'});
          this.b.push({x:i%2===0?rf(40,W*0.2):rf(W*0.8,W-40),y:rf(H*0.55,H*0.8),r:20,oi:i,cut:false});
        }
        // Reflection wall
        this.w.push({x1:W*0.4,y1:H*0.2,x2:W*0.6,y2:H*0.2,thick:6});
      }
      else{
        // MIXED: walls + obstacles + multiple relays
        const srcX=rf(W*0.2,W*0.45);
        drags.push(mkD(srcX,H-160,0,true,true));
        // Multiple relays in zigzag
        const dCount=Math.min(2+Math.floor(n/25),4);
        for(let i=1;i<=dCount;i++){
          const gy=H-160-i*(H-250)/(dCount+1);
          const dx=i%2===0?rf(W*0.15,W*0.4):rf(W*0.6,W*0.85);
          drags.push(mkD(dx,gy,ri(-180,180),true,false));
        }
        // Target on opposite side of last dragon
        const lastD=drags[drags.length-1];
        this.t={x:(lastD.x<W/2?rf(W*0.6,W*0.85):rf(W*0.1,W*0.35))-25,y:ri(45,80),w:50,h:55};
        // Angled reflection walls
        const wCount=1+Math.floor(n/20);
        for(let i=0;i<Math.min(wCount,3);i++){
          const wy=H*0.2+i*H*0.2;
          if(i%2===0){
            this.w.push({x1:W*0.3,y1:wy,x2:W*0.7,y2:wy+rf(30,80),thick:6});
          }else{
            this.w.push({x1:W*0.2,y1:wy+rf(20,60),x2:W*0.6,y2:wy,thick:6});
          }
        }
        // Obstacles in later levels
        if(n>25){
          const oc=Math.min(Math.floor((n-25)/20),2);
          for(let i=0;i<oc;i++){
            const oy=H*0.3+i*H*0.2;
            this.o.push({x:W*0.45-30,y:oy,w:60,h:60,active:true,img:rng()>0.5?'bear':'ultra'});
            this.b.push({x:i%2===0?rf(40,W*0.2):rf(W*0.8,W-40),y:rf(H*0.6,H*0.82),r:20,oi:i,cut:false});
          }
        }
      }
      this.d=drags;
    }
  };
}

let _allLevelsCache=null;
function getAllLevels(){
  if(_allLevelsCache)return _allLevelsCache;
  const tuts=getTutorials();
  const levels=[];
  for(let i=0;i<100;i++)levels.push(genLevel(i));
  _allLevelsCache={tuts,levels};
  return _allLevelsCache;
}

// ─── SOUND TRACE ───
function fire(){
  if(firing||won)return;
  const src=dragons.find(d=>d.isSource);if(!src)return;
  if(fireCount>0){attemptStars=Math.max(1,attemptStars-1);updateStarHUD();} // 重新大笑扣1星,保底1
  fireCount++;
  soundPath=[];firing=true;fireTimer=0;
  dragons.forEach(d=>{d.hit=false;d.laughing=false});
  src.laughing=true;
  trace(src.x,src.y,src.angle,0);
  playLaugh();
}

function trace(sx,sy,ang,depth){
  if(depth>15)return;
  const dx=Math.cos(ang),dy=Math.sin(ang),step=3;
  const maxSteps=Math.ceil(Math.hypot(W,H)*2/step);
  let x=sx+dx*46,y=sy+dy*46;
  for(let i=0;i<maxSteps;i++){
    x+=dx*step;y+=dy*step;
    if(x<2){soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:2,ey:y,d:depth});trace(2,y,Math.PI-ang,depth+1);return}
    if(x>W-2){soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:W-2,ey:y,d:depth});trace(W-2,y,Math.PI-ang,depth+1);return}
    if(y<2){soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:x,ey:2,d:depth});trace(x,2,-ang,depth+1);return}
    if(x<-20||x>W+20||y<-20||y>H+20){soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:x,ey:y,d:depth});return}
    for(const wire of wires){if(!wire.cut&&Math.hypot(x-wire.x,y-wire.y)<wire.r){wire.cut=true;if(obstacles[wire.oi])obstacles[wire.oi].active=false;playClick()}}
    for(const obs of obstacles){if(obs.active&&x>=obs.x&&x<=obs.x+obs.w&&y>=obs.y&&y<=obs.y+obs.h){soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:x,ey:y,d:depth});return}}
    for(const w of walls){if(ptSD(x,y,w.x1,w.y1,w.x2,w.y2)<(w.thick||4)){
      soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:x,ey:y,d:depth});
      const wa=Math.atan2(w.y2-w.y1,w.x2-w.x1),n=wa+Math.PI/2;
      const newAng=2*n-ang-Math.PI;
      trace(x+Math.cos(newAng)*10,y+Math.sin(newAng)*10,newAng,depth+1);return;
    }}
    if(target&&x>=target.x&&x<=target.x+target.w&&y>=target.y&&y<=target.y+target.h){
      soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:target.x+target.w/2,ey:target.y+target.h/2,d:depth,win:true});
      won=true;
      const firstClear=!cleared.includes(currentLevelId);
      if(firstClear){cleared.push(currentLevelId);coins+=5;}
      const prevStars=starBest[currentLevelId]||0;
      if(attemptStars>prevStars){starBank+=attemptStars-prevStars;starBest[currentLevelId]=attemptStars;}
      save();
      setTimeout(()=>{
        document.getElementById('wt').textContent='🎉 通关!';
        document.getElementById('wm').textContent='笑声送达手机！  '+'⭐'.repeat(attemptStars)+'☆'.repeat(3-attemptStars);
        document.getElementById('wc').textContent=(firstClear?'🪙 +5   ':'')+(attemptStars>prevStars?'⭐ +'+(attemptStars-prevStars):'');
        document.getElementById('wb').textContent=currentLevelId.startsWith('t')&&currentLevel<TOTAL_TUT-1?'下一关 →':'🎲 再来一关';
        document.getElementById('hud-coins').textContent='🪙 '+coins;
        document.getElementById('win-ov').classList.add('show');
      },800);return;
    }
    for(const d of dragons){
      if(d.isSource&&depth===0)continue;if(d.hit)continue;
      if(Math.hypot(x-d.x,y-d.y)<d.r){d.hit=true;d.laughing=true;
        soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:d.x,ey:d.y,d:depth});
        trace(d.x,d.y,d.angle,depth+1);return;}
    }
  }
  soundPath.push({sx:sx+dx*46,sy:sy+dy*46,ex:x,ey:y,d:depth});
}
function ptSD(px,py,x1,y1,x2,y2){const A=px-x1,B=py-y1,C=x2-x1,D=y2-y1,dot=A*C+B*D,len=C*C+D*D;let t=len?dot/len:-1;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*C),py-(y1+t*D))}

// ─── DRAWING ───
function drawDragon(d,time){
  ctx.save();ctx.translate(d.x,d.y);
  const imgs=skinImgs[skin]||skinImgs.yellow;
  const img=d.laughing?imgs.laugh:imgs.calm;
  const sz=d.r*2.3;
  // Clip circle + dark bg
  ctx.save();ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.clip();
  ctx.fillStyle='#222';ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.fill();
  // Rotate so face points in angle direction (image default faces UP, so subtract PI/2)
  ctx.rotate(d.angle+Math.PI/2);
  if(img.complete)ctx.drawImage(img,-sz/2,-sz/2,sz,sz);
  ctx.restore();
  // Border
  ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);
  ctx.strokeStyle=d.laughing?'rgba(255,215,0,0.7)':'rgba(200,200,200,0.25)';ctx.lineWidth=2;ctx.stroke();
  // Glow
  if(d.hit){ctx.beginPath();ctx.arc(0,0,d.r+10,0,Math.PI*2);ctx.strokeStyle='rgba(255,215,0,'+(0.4+Math.sin(time*8)*0.3)+')';ctx.lineWidth=3;ctx.stroke()}
  // Arrow
  if(d.rotatable&&!firing){
    ctx.save();ctx.rotate(d.angle);
    ctx.strokeStyle='rgba(255,215,0,0.25)';ctx.lineWidth=1.5;ctx.setLineDash([5,5]);
    ctx.beginPath();ctx.moveTo(d.r+6,0);ctx.lineTo(d.r+55,0);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,215,0,0.45)';ctx.beginPath();ctx.moveTo(d.r+50,-6);ctx.lineTo(d.r+60,0);ctx.lineTo(d.r+50,6);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawTarget(time){
  if(!target)return;
  const cx=target.x+target.w/2,cy=target.y+target.h/2;
  ctx.fillStyle='#2a2a3a';ctx.strokeStyle='#555';ctx.lineWidth=2;
  ctx.beginPath();const rx=target.x,ry=target.y,rw=target.w,rh=target.h,rr=10;
  ctx.moveTo(rx+rr,ry);ctx.lineTo(rx+rw-rr,ry);ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+rr);
  ctx.lineTo(rx+rw,ry+rh-rr);ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-rr,ry+rh);
  ctx.lineTo(rx+rr,ry+rh);ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-rr);
  ctx.lineTo(rx,ry+rr);ctx.quadraticCurveTo(rx,ry,rx+rr,ry);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#1a3050';ctx.fillRect(target.x+5,target.y+10,target.w-10,target.h-20);
  ctx.beginPath();ctx.arc(cx,target.y+target.h-6,3,0,Math.PI*2);ctx.strokeStyle='#666';ctx.lineWidth=1;ctx.stroke();
  if(won){ctx.beginPath();ctx.arc(cx,cy,33+Math.sin(time*6)*6,0,Math.PI*2);ctx.strokeStyle='rgba(50,255,100,0.5)';ctx.lineWidth=3;ctx.stroke()}
  ctx.fillStyle=won?'#4f4':'#88f';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText(won?'✅':'📱',cx,cy+6);
}

function drawSound(time){
  if(!soundPath.length)return;
  for(let i=0;i<soundPath.length;i++){
    const s=soundPath[i],prog=Math.min(1,(fireTimer-s.d*18)/35);if(prog<=0)continue;
    const ex=s.sx+(s.ex-s.sx)*Math.min(1,prog),ey=s.sy+(s.ey-s.sy)*Math.min(1,prog);
    const ang=Math.atan2(s.ey-s.sy,s.ex-s.sx);
    ctx.beginPath();ctx.moveTo(s.sx,s.sy);ctx.lineTo(ex,ey);
    ctx.strokeStyle=s.win?'rgba(50,255,100,0.1)':'rgba(255,215,0,0.08)';ctx.lineWidth=1;ctx.stroke();
    for(let w=0;w<6;w++){const wT=((time*1.8+w/6)%1),wp=wT*prog;if(wp<=0||wp>prog)continue;
      const wx=s.sx+(ex-s.sx)*wp/prog,wy=s.sy+(ey-s.sy)*wp/prog,ar=8+wT*16,al=(1-wT)*0.55;
      ctx.beginPath();ctx.arc(wx,wy,ar,ang-0.5,ang+0.5);ctx.strokeStyle=s.win?'rgba(50,255,100,'+al+')':'rgba(255,215,0,'+al+')';ctx.lineWidth=2.5;ctx.stroke();
      ctx.beginPath();ctx.arc(wx,wy,ar,ang+Math.PI-0.5,ang+Math.PI+0.5);ctx.strokeStyle=s.win?'rgba(50,255,100,'+al*0.6+')':'rgba(255,215,0,'+al*0.6+')';ctx.lineWidth=2;ctx.stroke();
    }
    if(prog>0.1){const fr=12+Math.sin(time*10)*4;ctx.beginPath();ctx.arc(ex,ey,fr,ang-0.8,ang+0.8);ctx.strokeStyle=s.win?'rgba(50,255,100,0.6)':'rgba(255,215,0,0.5)';ctx.lineWidth=3;ctx.stroke()}
    if(prog>0.35){ctx.fillStyle='rgba(255,255,255,'+(0.4*prog)+')';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('哈',s.sx+(ex-s.sx)*0.4+Math.cos(ang+1.2)*14,s.sy+(ey-s.sy)*0.4+Math.sin(ang+1.2)*14)}
  }
}

function drawWalls(){walls.forEach(w=>{ctx.beginPath();ctx.moveTo(w.x1,w.y1);ctx.lineTo(w.x2,w.y2);ctx.strokeStyle='#8ecae6';ctx.lineWidth=w.thick||6;ctx.lineCap='round';ctx.stroke();ctx.strokeStyle='rgba(142,202,230,0.12)';ctx.lineWidth=(w.thick||6)+8;ctx.stroke()})}
function drawObs(){obstacles.forEach(o=>{
  if(o.destroyed)return;            // 被激光炸毁→消失
  const faded=!o.active;            // 断电→虚化
  const img=o.img==='bear'?imgBear:o.img==='ultra'?imgUltra:null;
  ctx.save();
  if(img&&img.complete){
    ctx.globalAlpha=faded?0.18:0.85;ctx.drawImage(img,o.x,o.y,o.w,o.h);
    ctx.globalAlpha=faded?0.3:1;ctx.lineWidth=2;ctx.setLineDash(faded?[6,5]:[]);
    ctx.strokeStyle=faded?'rgba(127,212,255,0.7)':'rgba(255,50,50,0.5)';
    ctx.strokeRect(o.x-1,o.y-1,o.w+2,o.h+2);ctx.setLineDash([]);
  }else{
    ctx.fillStyle=faded?'rgba(127,212,255,0.18)':'rgba(231,76,60,0.7)';ctx.fillRect(o.x,o.y,o.w,o.h);
  }
  ctx.restore();
})}
function drawWires(){wires.forEach(w=>{
  ctx.save();ctx.lineCap='round';ctx.textAlign='center';ctx.textBaseline='middle';
  if(w.cut){
    ctx.strokeStyle='#555';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(w.x-w.r*0.6,w.y);ctx.lineTo(w.x-5,w.y-3);ctx.moveTo(w.x+5,w.y+3);ctx.lineTo(w.x+w.r*0.6,w.y);ctx.stroke();
    ctx.fillStyle='#777';ctx.font='11px sans-serif';ctx.fillText('断电',w.x,w.y-w.r-4);
  }else{
    const pulse=0.6+0.4*Math.sin(Date.now()/120);
    ctx.shadowColor='#7fd4ff';ctx.shadowBlur=12*pulse;
    ctx.strokeStyle='#f1c40f';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(w.x-w.r*0.6,w.y);ctx.lineTo(w.x+w.r*0.6,w.y);ctx.stroke();
    ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText('⚡',w.x,w.y);
    ctx.strokeStyle='rgba(127,212,255,'+(0.35*pulse)+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
})}

// ─── INPUT ───
function gp(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY}}
canvas.addEventListener('mousedown',onD);canvas.addEventListener('mousemove',onM);window.addEventListener('mouseup',onU);window.addEventListener('mouseleave',onU);
canvas.addEventListener('touchstart',e=>{e.preventDefault();onD(e)},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();onM(e)},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();onU(e)},{passive:false});
canvas.addEventListener('touchcancel',e=>{e.preventDefault();onU(e)},{passive:false});
function onD(e){if(gameState!=='play'||won)return;const p=gp(e);
  for(const d of dragons){if(!d.rotatable)continue;if(Math.hypot(p.x-d.x,p.y-d.y)<d.r+35){dragging=d;if(firing){soundPath=[];firing=false;fireTimer=0;dragons.forEach(d2=>{d2.hit=false;d2.laughing=false})}return}}
}
function onM(e){if(!dragging)return;const p=gp(e);dragging.angle=Math.atan2(p.y-dragging.y,p.x-dragging.x)}
function onU(){dragging=null}

// ─── SOUND ───
const AC=window.AudioContext||window.webkitAudioContext;let _a=null;function ac(){if(!_a)_a=new AC();return _a}
function playLaugh(){
  try{
    laughAudio.currentTime=0;
    laughAudio.volume=1.0;
    const p=laughAudio.play();
    if(p)p.catch(()=>{});
  }catch(e){}
  // Fallback synth sound
  try{const a=ac();[0,100,200].forEach((dl,i)=>{setTimeout(()=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=800-i*100;g.gain.setValueAtTime(0.08,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.1);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+0.1)},dl)})}catch(e){}
}
// Unlock audio on first touch (mobile requirement)
document.addEventListener('touchstart',function unlockAudio(){laughAudio.play().then(()=>{laughAudio.pause();laughAudio.currentTime=0}).catch(()=>{});document.removeEventListener('touchstart',unlockAudio)},{once:true});
function playClick(){try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=600;g.gain.setValueAtTime(0.1,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.06);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+0.06)}catch(e){}}

// ─── GAME LOOP ───
function activateLaser(){
  if(gameState!=='play'||laserMode||won)return;
  if(laserCharges<=0){alert('没有激光弹了！去星星商店买');return}
  const src=dragons.find(d=>d.isSource);if(!src)return;
  laserCharges--;save();updateLaserBtn();
  laserMode=true;laserTimer=0;
  // 激光沿奶龙朝向射出，记录光束端点
  const dx=Math.cos(src.angle),dy=Math.sin(src.angle);
  let ex=src.x,ey=src.y;const step=4,maxL=Math.hypot(W,H)*1.5;
  for(let t=46;t<maxL;t+=step){
    ex=src.x+dx*t;ey=src.y+dy*t;
    if(ex<-30||ex>W+30||ey<-30||ey>H+30)break;
    // 摧毁路径上的障碍(手机、墙不受影响)
    for(const obs of obstacles){
      if(obs.active&&ex>=obs.x&&ex<=obs.x+obs.w&&ey>=obs.y&&ey<=obs.y+obs.h){obs.active=false;obs.destroyed=true;}
    }
  }
  laserBeam={x1:src.x,y1:src.y,x2:ex,y2:ey};
  try{const o=ac(),osc=o.createOscillator(),g=o.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(800,o.currentTime);osc.frequency.exponentialRampToValueAtTime(80,o.currentTime+0.5);g.gain.setValueAtTime(0.18,o.currentTime);g.gain.exponentialRampToValueAtTime(0.001,o.currentTime+0.6);osc.connect(g);g.connect(o.destination);osc.start();osc.stop(o.currentTime+0.6)}catch(e){}
}
window.activateLaser=activateLaser;

function drawLaser(time){
  if(!laserMode)return;
  const src=dragons.find(d=>d.isSource);if(!src||!laserBeam)return;
  const flick=0.7+Math.random()*0.3;
  // 激光主束
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(120,200,255,'+flick+')';ctx.lineWidth=18;
  ctx.beginPath();ctx.moveTo(laserBeam.x1,laserBeam.y1);ctx.lineTo(laserBeam.x2,laserBeam.y2);ctx.stroke();
  ctx.strokeStyle='rgba(255,80,80,'+flick+')';ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(laserBeam.x1,laserBeam.y1);ctx.lineTo(laserBeam.x2,laserBeam.y2);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,'+flick+')';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(laserBeam.x1,laserBeam.y1);ctx.lineTo(laserBeam.x2,laserBeam.y2);ctx.stroke();
  ctx.restore();
  // 暴走奶龙身上的雷电
  ctx.save();ctx.strokeStyle='rgba(150,220,255,0.9)';ctx.lineWidth=2;
  for(let k=0;k<5;k++){
    let a=Math.random()*Math.PI*2,lx=src.x,ly=src.y;ctx.beginPath();ctx.moveTo(lx,ly);
    for(let s=0;s<4;s++){a+=(Math.random()-0.5)*1.5;lx+=Math.cos(a)*12;ly+=Math.sin(a)*12;ctx.lineTo(lx,ly)}
    ctx.stroke();
  }
  ctx.restore();
  // 若提供了你的暴走原图,叠在奶龙上
  if(LASER_SPRITE_SRC&&laserSprite.complete){
    const sz=150;ctx.drawImage(laserSprite,src.x-sz/2,src.y-sz/2,sz,sz);
  }
}

function resetShot(){firing=false;fireTimer=0;soundPath=[];dragons.forEach(d=>{d.hit=false;d.laughing=false})}
let rafId=null;
function startLoop(){if(!rafId)rafId=requestAnimationFrame(loop)}
function stopLoop(){if(rafId){cancelAnimationFrame(rafId);rafId=null}}
function loop(ts){
  rafId=null;
  const time=ts/1000;
  ctx.fillStyle='#0f0f1a';ctx.fillRect(0,0,W,H);
  if(gameState!=='play'){return}
  ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  drawWalls();drawObs();drawWires();drawTarget(time);
  dragons.forEach(d=>drawDragon(d,time));
  if(laserMode){laserTimer++;drawLaser(time);if(laserTimer>LASER_DURATION){laserMode=false;laserBeam=null;}}
  if(firing){fireTimer++;drawSound(time);if(fireTimer>420&&!won)resetShot()}
  rafId=requestAnimationFrame(loop);
}

// ─── INIT ───
showMenu();
</script>
